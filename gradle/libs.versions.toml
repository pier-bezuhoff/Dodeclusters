[versions]
dodeclusters-version = "0.5.6"
dodeclusters-android-versionCode = "12"
dodeclusters-desktop-packageVersion = "1.0.5" # cannot start with 0 it seems
android-compileSdk = "37"
android-minSdk = "24" # = Android 7.0 Nougat
android-targetSdk = "37" # = Android 17

kotlin = "2.4.20"
# consult kmp-agp compatibility table:
# https://kotlinlang.org/docs/multiplatform-compatibility-guide.html#version-compatibility
#noinspection GradleDependency,AndroidGradlePluginVersion
agp = "9.3.1" # upper bound for kt 2.4.20
compose-multiplatform = "1.12.0"
# check compose-multiplatform/release for version compatibility:
# https://github.com/JetBrains/compose-multiplatform/releases/latest
#noinspection NewerVersionAvailable
lifecycle = "2.11.0"
#noinspection GradleDependency
material3 = "1.12.0-alpha03"
material3-adaptive = "1.3.0-beta02"
navigation3 = "1.2.0-alpha02"
# ^ depend on compose-multiplatform
serialization = "1.11.0"
coroutines = "1.11.0"
activity-compose = "1.13.0"
core-ktx = "1.19.0"
colormath = "3.7.0"
kaml = "0.104.0" # the repo is archived
kstore = "1.1.0"
appdirs = "2.0.0"
accompanist = "0.37.3"
#collection = "1.5.0"
navigation3-browser = "1.1.0"

[libraries]
compose-ui-graphics = { module = "org.jetbrains.compose.ui:ui-graphics", version.ref = "compose-multiplatform" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-ui-toolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-lifecycle-runtime = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "material3-adaptive" }
# adaptive navigation is added in m3-adaptive 1.3+
#material3-adaptive-navigation3 = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "material3-adaptive" }
compose-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
compose-navigation3-browser = { module = "com.github.terrakok:navigation3-browser", version.ref = "navigation3-browser" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization"}
colormath = { module = "com.github.ajalt.colormath:colormath", version.ref = "colormath" }
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kstore = { module = "io.github.xxfast:kstore", version.ref = "kstore" }
kstore-file = { module = "io.github.xxfast:kstore-file", version.ref = "kstore" }
kstore-storage = { module = "io.github.xxfast:kstore-storage", version.ref = "kstore" }
appdirs = { module = "ca.gosyer:kotlin-multiplatform-appdirs", version.ref = "appdirs" }
accompanist = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist" }
#collection = { module = "androidx.collection:collection", version.ref = "collection" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }

# don't use dashes for plugins, it's not worth it
[plugins]
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
